services:
  # ── Redis (Rate Limiting & Cache para OmniRoute) ──────────────────────────
  redis:
    image: redis:alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data

  # ── OmniRoute (AI Gateway Unificado) ──────────────────────────────────────
  omniroute:
    image: diegosouzapw/omniroute:latest
    restart: unless-stopped
    ports:
      - "20128:20128"
    environment:
      - PORT=20128
      - DASHBOARD_PORT=20128
      - API_PORT=20128
      - DATA_DIR=/app/data
      - NODE_ENV=production
      - REQUIRE_API_KEY=false
      - REDIS_URL=redis://redis:6379
    volumes:
      - omniroute-data:/app/data
    depends_on:
      - redis

  # ── Hermes Agent (Agente Autônomo com Web UI & Gateway) ───────────────────
  hermes:
    image: nousresearch/hermes-agent:latest
    pull_policy: always
    restart: unless-stopped
    stdin_open: true
    tty: true
    environment:
      - HERMES_HOME=/home/hermes/.hermes
      - HERMES_UID=1000
      - HERMES_GID=1000
      - HERMES_INFERENCE_MODEL=${HERMES_INFERENCE_MODEL:-teste}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-http://omniroute:20128/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-sk-343264ed9bd5abd7-c61762-5c68911f}
      - CUSTOM_BASE_URL=${CUSTOM_BASE_URL:-http://omniroute:20128/v1}
      - CUSTOM_API_KEY=${CUSTOM_API_KEY:-sk-343264ed9bd5abd7-c61762-5c68911f}
      # Ativação do Dashboard Web do Hermes
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_HOST=0.0.0.0
      - HERMES_DASHBOARD_PORT=9119
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=admin
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=admin
    volumes:
      - hermes-data:/home/hermes/.hermes
      - hermes-agent-src-v3:/opt/hermes
    depends_on:
      - omniroute

  # ── Hermes WebUI (Interface Gráfica Moderna / Chat Web & Desktop) ────────
  hermes-webui:
    image: ghcr.io/nesquena/hermes-webui:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      - HERMES_HOME=/home/hermeswebui/.hermes
      - HERMES_WEBUI_HOST=0.0.0.0
      - HERMES_WEBUI_PORT=8787
      - HERMES_WEBUI_STATE_DIR=/home/hermeswebui/.hermes/webui
      - HERMES_API_URL=http://hermes:8642
      - HERMES_WEBUI_PASSWORD=${HERMES_WEBUI_PASSWORD:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-http://omniroute:20128/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-sk-343264ed9bd5abd7-c61762-5c68911f}
      - CUSTOM_BASE_URL=${CUSTOM_BASE_URL:-http://omniroute:20128/v1}
      - CUSTOM_API_KEY=${CUSTOM_API_KEY:-sk-343264ed9bd5abd7-c61762-5c68911f}
      - WANTED_UID=1000
      - WANTED_GID=1000
    volumes:
      - hermes-data:/home/hermeswebui/.hermes
      - hermes-agent-src-v3:/home/hermeswebui/.hermes/hermes-agent:ro
      - hermes-workspace:/workspace
    depends_on:
      - hermes

  # ── Zupoo Locadora (Agente de Atendimento WhatsApp via WAHA) ──────────────
  zupoo-agente:
    build:
      context: ./zupoo-locadora-agente
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${ZUPOO_WEBHOOK_PORT:-8081}:8081"
    environment:
      - WAHA_URL=${WAHA_URL:-https://infra-waha.gvlvvh.easypanel.host}
      - WAHA_API_KEY=${WAHA_API_KEY:-}
      - WAHA_SESSION=${WAHA_SESSION:-5511993751000}
      - ZUPOO_RESPONDER_APENAS=${ZUPOO_RESPONDER_APENAS:-5511977556050@c.us}
      - ZUPOO_ACEITAR_SELFCHAT=${ZUPOO_ACEITAR_SELFCHAT:-true}
      - ZUPOO_WEBHOOK_PORT=8081
      - ZUPOO_WEBHOOK_URL=${ZUPOO_WEBHOOK_URL:-https://webhook.movilo.com.br/webhook/waha}
      - ZUPOO_PERSIST_DIR=/hermes-data/zupoo-locadora-agente
    volumes:
      - hermes-data:/hermes-data

volumes:
  redis-data:
  omniroute-data:
  hermes-data:
  hermes-workspace:
  hermes-agent-src-v3:
