services:
  # ── Redis (Rate Limiting & Cache para OmniRoute) ──────────────────────────
  redis:
    image: redis:alpine
    container_name: omniroute-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    networks:
      - hermes-net

  # ── OmniRoute (AI Gateway Unificado) ──────────────────────────────────────
  omniroute:
    image: diegosouzapw/omniroute:latest
    container_name: omniroute
    restart: unless-stopped
    ports:
      - "${OMNIROUTE_PORT:-20128}:20128"
    environment:
      - PORT=20128
      - DASHBOARD_PORT=20128
      - API_PORT=20128
      - DATA_DIR=/app/data
      - NODE_ENV=production
      - REQUIRE_API_KEY=false
      - REDIS_URL=redis://omniroute-redis:6379
    volumes:
      - ./data/omniroute:/app/data
    depends_on:
      - redis
    networks:
      - hermes-net

  # ── Hermes Agent (Agente Autônomo com Web UI & Gateway) ───────────────────
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped
    stdin_open: true
    tty: true
    ports:
      - "${HERMES_DASHBOARD_PORT:-9119}:9119"
      - "${HERMES_GATEWAY_PORT:-8642}:8642"
    environment:
      - HERMES_HOME=/opt/data
      - HERMES_INFERENCE_MODEL=${HERMES_INFERENCE_MODEL:-auto}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-http://omniroute:20128/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - CUSTOM_BASE_URL=${CUSTOM_BASE_URL:-http://omniroute:20128/v1}
      - CUSTOM_API_KEY=${CUSTOM_API_KEY:-${OPENAI_API_KEY}}
      # Ativação do Dashboard Web do Hermes
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_HOST=0.0.0.0
      - HERMES_DASHBOARD_PORT=9119
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=admin
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=admin
    volumes:
      - ./data/hermes:/opt/data
      - hermes-agent-src:/opt/hermes
    depends_on:
      - omniroute
    networks:
      - hermes-net

  # ── Hermes WebUI (Interface Gráfica Moderna / Chat Web & Desktop) ────────
  hermes-webui:
    image: ghcr.io/nesquena/hermes-webui:latest
    container_name: hermes-webui
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      - HERMES_HOME=/home/hermeswebui/.hermes
      - HERMES_WEBUI_HOST=0.0.0.0
      - HERMES_WEBUI_PORT=8787
      - HERMES_WEBUI_STATE_DIR=/home/hermeswebui/.hermes/webui
      - HERMES_API_URL=http://hermes:8642
      - WANTED_UID=1000
      - WANTED_GID=1000
    volumes:
      - ./data/hermes:/home/hermeswebui/.hermes
      - hermes-agent-src:/home/hermeswebui/.hermes/hermes-agent:ro
      - ./data/hermes/workspace:/workspace
    depends_on:
      - hermes
    networks:
      - hermes-net

networks:
  hermes-net:
    name: hermes-net
    driver: bridge

volumes:
  redis-data:
  hermes-agent-src:
